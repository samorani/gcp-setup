<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Office Hours{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #6b6f76;
      --border: #e3e0da;
      --accent: #2f5d50;
      --accent-hover: #244a40;
      --accent-soft: #e4eeea;
      --error-bg: #fbeaea;
      --error-text: #8a2424;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181b;
        --surface: #1f2226;
        --text: #e8e6e3;
        --muted: #9a9ea5;
        --border: #2e3237;
        --accent: #6fb39c;
        --accent-hover: #86c4af;
        --accent-soft: #23332e;
        --error-bg: #3a2222;
        --error-text: #f0b4b4;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .bar {
      max-width: 960px;
      margin: 0 auto;
      padding: .9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 650;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
    }
    .brand-mark {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--surface);
      display: grid; place-items: center;
      font-size: .9rem;
    }
    nav { display: flex; align-items: center; gap: .5rem; }
    nav form { margin: 0; }
    .who { color: var(--muted); font-size: .9rem; margin-right: .25rem; }

    .btn {
      display: inline-block;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: .5rem 1rem;
      font: inherit;
      font-size: .95rem;
      font-weight: 550;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btn-primary { background: var(--accent); color: var(--surface); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--muted); }
    .btn-block { width: 100%; padding: .7rem 1rem; }

    main {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }
    .card {
      max-width: 400px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }
    .card h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .card .sub { margin: 0 0 1.5rem; color: var(--muted); }

    .flash {
      max-width: 400px;
      margin: 0 auto 1rem;
      padding: .7rem 1rem;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: .95rem;
    }
    .flash.error { background: var(--error-bg); color: var(--error-text); }

    label { display: block; font-size: .9rem; font-weight: 550; margin-bottom: 1rem; }
    input {
      display: block;
      width: 100%;
      margin-top: .35rem;
      padding: .65rem .75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .alt { margin: 1.25rem 0 0; text-align: center; color: var(--muted); font-size: .9rem; }

    .hero { text-align: center; max-width: 560px; margin: 2rem auto 0; }
    .hero h1 { font-size: 2.2rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
    .hero p { color: var(--muted); font-size: 1.1rem; margin: 0 0 1.75rem; }
    .hero .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    .avatar {
      width: 72px; height: 72px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid; place-items: center;
      font-size: 1.8rem; font-weight: 650;
    }

    .sheet-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .sheet-head h1 { margin: 0; font-size: 1.8rem; letter-spacing: -.01em; }
    .sheet-head .sub { margin: .25rem 0 0; color: var(--muted); }
    .badge {
      display: inline-block;
      margin-left: .5rem;
      padding: .1rem .55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .8rem;
      font-weight: 600;
    }
    .week-nav { display: flex; gap: .5rem; }
    .days {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
    }
    .day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .day h2 { margin: 0 0 .75rem; font-size: 1rem; }
    .day h2 span { color: var(--muted); font-weight: 450; }
    .day ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
    .slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .4rem;
      min-height: 2.6rem;
      padding: .35rem .6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
    }
    .slot form { margin: 0; }
    .slot .time { font-variant-numeric: tabular-nums; font-weight: 550; }
    .slot .status { color: var(--muted); }
    .slot.mine { background: var(--accent-soft); border-color: var(--accent); }
    .slot.mine .status { color: var(--accent); font-weight: 600; }
    .slot.taken { background: var(--bg); }
    .slot.past { opacity: .5; }
    .btn-small { padding: .25rem .7rem; font-size: .85rem; }

    footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">OH</span>Office Hours</a>
      <nav>
        {% if session.username %}
          <span class="who">{{ session.username }}</span>
          <form method="post" action="{{ url_for('logout') }}"><button class="btn btn-ghost" type="submit">Log out</button></form>
        {% else %}
          <a class="btn btn-ghost" href="{{ url_for('login') }}">Log in</a>
          <a class="btn btn-primary" href="{{ url_for('register') }}">Register</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <footer>Office Hours Sign-Up</footer>
</body>
</html>
