{% extends "base.html" %}
{% block title %}Register · Office Hours{% endblock %}
{% block content %}
  <div class="card">
    <h1>Create an account</h1>
    <p class="sub">Pick a username and password to get started.</p>
    <form method="post">
      <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
{% endblock %}
